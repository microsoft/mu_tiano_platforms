[config]
no_missing_rules = true

[[key]]
signature = ['F', 'P', 'O', 'L']
symbol = 'patina_mm_supervisor::state::SECURITY_STATE'
field = 'policy_gate.data.policy_ptr'

[[key]]
signature = ['P', 'G', 'T', 'B']
symbol = 'patina_mm_supervisor::state::SECURITY_STATE'
field = 'page_table.data.variant1.base'

[[key]]
signature = ['M', 'R', 'D', 'V']
symbol = 'efi_main'

[[rule]]
symbol = "q35_mm_supervisor::SUPERVISOR"
field = 'mailbox_manager'
validation.type = "none"
remarks = "This is the mailboxes between BSP and APs. We would not be able to validate the status of them."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::SUPERVISOR"
array.field = 'cpu_manager.slots'
array.index = [0, 7]
validation.type = "non zero"
# This is the CPU status slots, we can call them out specifically. But we table them here for first pass
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::SUPERVISOR"
field = 'cpu_manager.registered_count'
validation.type = "content"
validation.content = [0x08, 0x00, 0x00, 0x00]
remarks = "Total number of cores, this indicates the total number of CPUs that should arrive in each MMI"
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::SUPERVISOR"
field = 'cpu_manager.bsp_id'
validation.type = "none"
remarks = "This is the BSP ID, maybe this is 0, but not guaranteed."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::SUPERVISOR"
field = 'syscall_interface.state.lock'
validation.type = "content"
validation.content = [0x00]
remarks = "Syscall interface state lock, should be clear now."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::SUPERVISOR"
field = 'syscall_interface.initialized'
validation.type = "content"
validation.content = [0x01]
remarks = "Indicates that the syscall interface has been initialized."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::SUPERVISOR"
field = 'syscall_interface.state.data.num_cpus'
validation.type = "content"
validation.content = [0x08, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
remarks = "Indicates the number of CPUs initialized during bootstrapping."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::SUPERVISOR"
field = 'syscall_interface.state.data.cpl3_stack_base'
validation.type = "mem attr"
validation.memory_size = 0x1000
validation.must_have = 0x4000                                                                                                     # EFI_MEMORY_XP
validation.must_not_have = 0x62000                                                                                                # EFI_MEMORY_SP | EFI_MEMORY_RO | EFI_MEMORY_RP
remarks = "Array of per CPU stack for ring3. NumberOfCpus*EFI_SIZE_TO_PAGES(x) making it aligned to EFI_PAGE_SIZE(4KB) boundary."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::SUPERVISOR"
field = 'syscall_interface.state.data.stack_size'
validation.type = "non zero"
remarks = "Size of stack should not be 0."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::SUPERVISOR"
field = 'initialized'
validation.type = "non zero"
remarks = "Indicates that the supervisor has been initialized."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::SUPERVISOR"
field = 'init_lock'
validation.type = "content"
validation.content = [0x00]
remarks = "One time initialization lock, should be clear now."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::LOGGER"
field = 'max_level'
validation.type = "content"
validation.content = [0x03, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
remarks = "Maximum log level at Info for the logger."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::LOGGER"
field = 'serial_port.lock'
validation.type = "content"
validation.content = [0x00]
remarks = "QEMU Q35 serial port lock, should be released now."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::LOGGER"
field = 'serial_port.data.tag'
validation.type = "content"
validation.content = [0x00, 0x00]
remarks = "Uart16550 discriminant. 0 selects the port I/O variant, so the logger cannot be switched to MMIO."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::LOGGER"
field = 'serial_port.data.variant0.__0'
validation.type = "content"
validation.content = [0x02, 0x04]
remarks = "QEMU Q35 debug serial I/O port 0x402, owned exclusively by this binary."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::LOGGER"
field = 'serial_port.data.variant1.__0'
validation.type = "none"
remarks = "Register block of the MMIO variant. The discriminant above pins the enum to port I/O, so this storage is unreachable, and reversion restores it regardless."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::LOGGER"
field = 'target_filters'
validation.type = "non zero"
remarks = "Target filters for the logger, there is no solid way to verify this."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::LOGGER"
field = 'format'
validation.type = "content"
validation.content = [0x00]
remarks = "Format for the logger, which is set to Format::Standard."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "q35_mm_supervisor::ADV_LOGGER_INIT_COMPLETE"
validation.type = "content"
validation.content = [0x01]
remarks = "Indicates that the logger initialization is complete."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "smrr_range.status"
validation.type = "content"
validation.content = [0x02]
remarks = "Indicates that the SMRR range is initialized."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "smrr_range.data.base"
validation.type = "pointer"
remarks = "Pointer to the base of the SMRR range in the initial state, it should be part of TSEG but not MSEG"
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "smrr_range.data.pre_allocated"
validation.type = "none"
remarks = "It does not matter if this field is set or not, the supervisor will handle it accordingly."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "smrr_range.data.size"
validation.type = "non zero"
remarks = "Size of SMRR range should not be 0"
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "supervisor.data"
validation.type = "self"
validation.reference = "q35_mm_supervisor::SUPERVISOR"
remarks = "This field carries the pointer to the SUPERVISOR instance"
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "supervisor.status"
validation.type = "content"
validation.content = [0x02]
remarks = "This field indicates the status of the structure is initialized."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "mm_initialized_buffer.data"
validation.type = "mem attr"
validation.memory_size = 0x1000
validation.must_have = 0x44000                                                                                                    # EFI_MEMORY_SP | EFI_MEMORY_XP
validation.must_not_have = 0x22000                                                                                                # EFI_MEMORY_RO | EFI_MEMORY_RP
remarks = "This should host the pointer to mSmmInitialized."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "mm_initialized_buffer.status"
validation.type = "content"
validation.content = [0x02]
remarks = "This field indicates the status of the structure is initialized."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "mseg_base.status"
validation.type = "content"
validation.content = [0x02]
remarks = "This field indicates the mseg_base is initialized."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "mseg_base.data"
validation.type = "pointer"
validation.in_mseg = true
remarks = "This is mseg_base. So it should be in MSEG"
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "ap_startup_fn.status"
validation.type = "content"
validation.content = [0x02]
remarks = "Indicates the AP startup function is initialized."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "ap_startup_fn.data"
validation.type = "self"
validation.reference = 'patina_mm_supervisor::MmSupervisorCore<q35_mm_supervisor::Q35Platform,8>::start_ap_procedure_trampoline<q35_mm_supervisor::Q35Platform,8>'
remarks = "We used a trampoline to make the raw AP startup function callable."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "per_core_init_count"
validation.type = "non zero"
remarks = "This is a counter, used to notify the APs that BSP is ready to exit."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "bsp_init_complete"
validation.type = "content"
validation.content = [0x01]
remarks = "Indicates that the BSP initialization is complete."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "at_runtime"
validation.type = "content"
validation.content = [0x00]
remarks = "Flag set at the exit boot services handler."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "user_entry_point.status"
validation.type = "content"
validation.content = [0x02]
remarks = "Indicator that the user_entry_point is set."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::INIT_STATE"
field = "user_entry_point.data"
validation.type = "mem attr"
validation.memory_size = 0x1000
validation.must_have = 0x20000                                                                                                    # EFI_MEMORY_RO
validation.must_not_have = 0x46000                                                                                                # EFI_MEMORY_SP | EFI_MEMORY_XP | EFI_MEMORY_RP
remarks = "Function pointer to jump to for handler demotion."
last-reviewed = "2026-08-05"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
validation.type = "none"
last-reviewed = "2026-07-29"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "page_table.lock"
validation.type = "content"
validation.content = [0x00]
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "page_table.data.variant1.base"
validation.type = "mem attr"
validation.memory_size = 0x1000
validation.must_have = 0x64000                                                                                                    # EFI_MEMORY_SP | EFI_MEMORY_XP | EFI_MEMORY_RO
validation.must_not_have = 0x2000                                                                                                 # EFI_MEMORY_RP
remarks = "The base of the page table should be supervisor controlled read only pages."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "page_table.data.variant1.paging_type"
validation.type = "content"
validation.content = [0x01]
remarks = "Paging type. 1 = Paging4Level."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "paging_allocator.data.pool_base"
validation.type = "mem attr"
validation.memory_size = 0x1000
validation.must_have = 0x44000                                                                                                    # EFI_MEMORY_SP | EFI_MEMORY_XP
validation.must_not_have = 0x22000                                                                                                 # EFI_MEMORY_RO | EFI_MEMORY_RP
remarks = "Paging pool base. This is used to allocate pages for the page table. Supervisor only data region."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "paging_allocator.data.pool_pages"
validation.type = "non zero"
remarks = "Number of paging pool pages, should not be zero."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "paging_allocator.data.current_offset"
validation.type = "none"
remarks = "Current offset within the paging pool. No way to validate this."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "paging_allocator.data.allocated_pages"
validation.type = "none"
remarks = "Number of allocated pages within the paging pool. No way to validate this."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "paging_allocator.data.initialized"
validation.type = "content"
validation.content = [0x01]
remarks = "Whether the paging pool has been initialized. Should be initialized at this stage."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "save_state_info.data.number_of_cpus"
validation.type = "content"
validation.content = [0x08, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
remarks = "Number of CPUs. Should be 8 at this stage."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "save_state_info.data.processor_info"
validation.type = "mem attr"
validation.memory_size = 0x48                                                                                                    # At cover the first PROCESSOR_INFO_ENTRY_SIZE (48)
validation.must_have = 0x24000                                                                                                    # EFI_MEMORY_RO | EFI_MEMORY_XP
validation.must_not_have = 0x2000                                                                                                 # EFI_MEMORY_RP
remarks = "EFI_PROCESSOR_INFORMATION array inside the MP Information HOB. The supervisor remaps the whole HOB list user read-only."
last-reviewed = "2026-08-07"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "save_state_info.data.sm_base"
validation.type = "mem attr"
validation.memory_size = 0x1000
validation.must_have = 0x44000                                                                                                    # EFI_MEMORY_SP | EFI_MEMORY_XP
validation.must_not_have = 0x22000                                                                                                 # EFI_MEMORY_RO | EFI_MEMORY_RP
remarks = "Pointer to SM bases for all cores. Should be supervisor data region."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "save_state_access.lock"
validation.type = "content"
validation.content = [0x00]
remarks = "This indicates whether the save state access lock is held. 0 = not held."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "save_state_access.data"
validation.type = "none"
remarks = "This is a transient data structure between two consecutive syscalls, no need to validate it here."
last-reviewed = "2026-08-07"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "policy_gate.data.policy_ptr"
validation.type = "mem attr"
validation.memory_size = 0x1000
validation.must_have = 0x44000                                                                                                    # EFI_MEMORY_SP | EFI_MEMORY_XP
validation.must_not_have = 0x22000                                                                                                 # EFI_MEMORY_RO | EFI_MEMORY_RP
remarks = "This data is a platform supplied secure policy, should be supervisor data."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "policy_gate.data.memory_policy_buffer"
validation.type = "mem attr"
validation.memory_size = 0x1000
validation.must_have = 0x44000                                                                                                    # EFI_MEMORY_SP | EFI_MEMORY_XP
validation.must_not_have = 0x22000                                                                                                 # EFI_MEMORY_RO | EFI_MEMORY_RP
remarks = "This data is a runtime collected memory policy, should be supervisor data."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "policy_gate.data.memory_policy_max_count"
validation.type = "non zero"
remarks = "This means how many memory policy entries can fit into our prepared buffer, can't be 0."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "policy_gate.data.snapshot_count"
validation.type = "non zero"
remarks = "This means how many memory descriptors are prepared in the snapshot, can't be 0."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "page_allocator.initialized"
validation.type = "content"
validation.content = [0x01]
remarks = "This indicates whether the page allocator has been initialized."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "page_allocator.state.lock"
validation.type = "content"
validation.content = [0x00]
remarks = "This indicates whether the page allocator lock is held. 0 = not held"
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "page_allocator.state.data"
validation.type = "mem attr"
validation.memory_size = 0x1000
validation.must_have = 0x44000                                                                                                    # EFI_MEMORY_SP | EFI_MEMORY_XP
validation.must_not_have = 0x22000                                                                                                 # EFI_MEMORY_RO | EFI_MEMORY_RP
remarks = "StatePtr to the AllocatorState in SMRAM. region_count, total_pages and the bookkeeping fields live at that address rather than in the image, so only the pointer and the attributes of the page it addresses can be checked here."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "paging_allocator.lock"
validation.type = "content"
validation.content = [0x00]
remarks = "This indicates whether the paging allocator lock is held. 0 = not held."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "page_table.data.variant1.page_allocator"
validation.type = "pointer"
remarks = "SharedPagingAllocator holds a &'static PagingPoolAllocator, which should be this symbol's own paging_allocator. A self reference can only name a symbol, not a field within one, so only the pointer itself is checked."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "unblocked_memory_tracker.initialized"
validation.type = "content"
validation.content = [0x01]
remarks = "This indicates whether the unblocked memory tracker has been initialized."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "unblocked_memory_tracker.core_init_complete"
validation.type = "content"
validation.content = [0x01]
remarks = "This indicates whether the unblocked memory tracker core initialization is complete."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "unblocked_memory_tracker.state.data.count"
validation.type = "non zero"
remarks = "This could be the same as maximal unblocked memory count. Cannot be 0."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "unblocked_memory_tracker.state.data.entries"
validation.type = "non zero"
remarks = "Could not test this... but this is the array of unblocked memory entries, should not be 0."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "comm_buffer_config.data.supv_comm_buffer"
validation.type = "mem attr"
validation.memory_size = 0x10000
validation.must_have = 0x44000                                                                                                    # EFI_MEMORY_SP | EFI_MEMORY_XP
validation.must_not_have = 0x22000                                                                                                 # EFI_MEMORY_RO | EFI_MEMORY_RP
remarks = "Supervisor communication buffer, should be supervisor data."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "comm_buffer_config.data.supv_comm_buffer_internal"
validation.type = "pointer"
validation.in_mseg = false
remarks = "Supervisor communication buffer internal, should be supervisor data."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "comm_buffer_config.data.supv_comm_buffer_size"
validation.type = "non zero"
remarks = "Supervisor communication buffer size, should be non zero."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "comm_buffer_config.data.user_comm_buffer"
validation.type = "mem attr"
validation.memory_size = 0x10000
validation.must_have = 0x44000                                                                                                    # EFI_MEMORY_SP | EFI_MEMORY_XP
validation.must_not_have = 0x22000                                                                                                 # EFI_MEMORY_RO | EFI_MEMORY_RP
remarks = "User communication buffer, should be supervisor data. Because users can only access the data through internal buffer."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "comm_buffer_config.data.user_comm_buffer_internal"
validation.type = "pointer"
validation.in_mseg = false
remarks = "User communication buffer internal, should be user data."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "comm_buffer_config.data.user_comm_buffer_size"
validation.type = "non zero"
remarks = "User communication buffer size, should be non zero."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "comm_buffer_config.data.user_status_buffer"
validation.type = "mem attr"
validation.memory_size = 0x1000
validation.must_have = 0x44000                                                                                                    # EFI_MEMORY_SP | EFI_MEMORY_XP
validation.must_not_have = 0x22000                                                                                                 # EFI_MEMORY_RO | EFI
remarks = "User status buffer, should be shared memory but supervisor data."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "comm_buffer_config.data.supv_status_buffer"
validation.type = "mem attr"
validation.memory_size = 0x1000
validation.must_have = 0x44000                                                                                                    # EFI_MEMORY_SP | EFI_MEMORY_XP
validation.must_not_have = 0x22000                                                                                                 # EFI_MEMORY_RO | EFI
remarks = "Supervisor status buffer, should be shared memory but still supervisor data."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "comm_buffer_config.data.supv_to_user_buffer"
validation.type = "mem attr"
validation.memory_size = 0x1000
validation.must_have = 0x4000                                                                                                    # EFI_MEMORY_SP | EFI_MEMORY_XP
validation.must_not_have = 0x62000                                                                                                 # EFI_MEMORY_RO | EFI
remarks = "Supervisor to user buffer, should be user accessible data. Used for supervisor to share data with users."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_mm_supervisor::state::SECURITY_STATE"
field = "comm_buffer_config.data.supv_to_user_buffer_size"
validation.type = "content"
validation.content = [0x00, 0x10, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]  # Example content representing the size
remarks = "Supervisor to user buffer size, hardcoded to 4K."
last-reviewed = "2026-08-06"

[[rule]]
symbol = "patina_internal_cpu::interrupts::exception_handling::EXCEPTION_HANDLERS"
array.index = [0, 31]
