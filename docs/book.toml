[book]
authors = ["Project Mu Contributors"]
language = "en"
src = "src"
title = "Mu Tiano Platforms"
description = "Documentation for the Project Mu Tiano Platforms (QEMU Q35 and QEMU Arm Virt)."

[output.html]
additional-js = ["cdn-assets.js", "mermaid.min.js", "mermaid-init.js"]
additional-css = ["./mdbook-admonish.css"]
git-repository-url = "https://github.com/microsoft/mu_tiano_platforms"
edit-url-template = "https://github.com/microsoft/mu_tiano_platforms/edit/main/docs/{path}"

[output.html.playpen]
editable = true
editor = "ace"
line-numbers = true

[output.linkcheck]
warning-policy = "warn"

[output.html.fold]
enable = true

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`
